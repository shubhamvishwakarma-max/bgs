<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DoubleTick Voice AI — Instant Lead Callback</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --accent:#2FE07E;
    --alert:#FF4B4B;
    --card:#F7F9F8;
    --ink:#0C1410;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  .stage{
    position:relative;
    width:1080px;height:1080px;
    overflow:hidden;
    background:url('../bg_01.png') center/cover no-repeat;
    font-family:'Geist',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- headline (inside the bg's top panel: y 120 → 355) ---------- */
  .headline{
    position:absolute;left:80px;top:120px;width:920px;height:235px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;
    color:#fff;font-weight:700;font-size:53px;line-height:78px;letter-spacing:-.6px;
    text-align:center;
  }
  .headline em{font-style:normal;color:var(--alert)}

  /* ---------- sub copy ---------- */
  .sub{
    position:absolute;left:110px;top:400px;width:860px;
    text-align:center;
    color:#C6D5CD;font-weight:400;font-size:23px;line-height:39px;letter-spacing:.1px;
  }

  /* ---------- flow visual ---------- */
  .node{
    position:absolute;width:132px;height:130px;border-radius:20px;
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .node.lead{left:145px;top:587px}
  .node.broker{left:803px;top:587px}
  .node-label{
    position:absolute;top:740px;width:132px;text-align:center;
    font-family:'Geist Mono',monospace;color:#fff;font-size:13px;font-weight:500;letter-spacing:3px;
  }
  .node-label.lead{left:145px}
  .node-label.broker{left:803px}

  .wire{position:absolute;top:684px;height:1px;background:linear-gradient(90deg,rgba(47,224,126,.15),rgba(47,224,126,.75));}
  .wire.l{left:277px;width:103px}
  .wire.r{left:700px;width:103px;background:linear-gradient(90deg,rgba(47,224,126,.75),rgba(47,224,126,.15))}
  .pip{position:absolute;top:681px;width:7px;height:7px;background:var(--accent);opacity:.9}
  .pip.a{left:279px}.pip.b{left:374px}.pip.c{left:699px}.pip.d{left:797px}

  /* centre call card */
  .call{
    position:absolute;left:380px;top:560px;width:320px;height:205px;
    background:var(--card);
    display:flex;flex-direction:column;align-items:center;
    padding-top:32px;
    box-shadow:0 26px 60px rgba(0,0,0,.5);
  }
  .call .ring{
    width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#2ddb7c,#0e9a55);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 8px rgba(47,224,126,.14);
  }
  .call .timer{
    margin-top:18px;
    font-family:'Geist Mono',monospace;font-weight:700;font-size:43px;
    color:var(--ink);letter-spacing:2px;
  }
  .call .status{
    margin-top:10px;display:flex;align-items:center;gap:8px;
    font-family:'Geist Mono',monospace;font-size:14px;font-weight:500;color:#17311F;
  }
  .call .status i{width:8px;height:8px;border-radius:50%;background:#16b45f;display:block}


  /* drop line from the call card down to the CTA */
  .drop{position:absolute;left:380px;top:770px;width:2px;height:88px;
        background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}

  /* ---------- CTA ---------- */
  .cta-shadow{
    position:absolute;left:252px;top:867px;width:600px;height:80px;
    border-radius:8px;background:rgba(10,40,26,.75);
  }
  .cta{
    position:absolute;left:240px;top:855px;width:600px;height:80px;border-radius:8px;
    background:linear-gradient(100deg,#155f3d 0%,#1b7b50 42%,#35b877 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), 0 12px 34px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    font-family:'Geist Mono',monospace;color:#fff;font-size:21px;font-weight:600;letter-spacing:4.2px;
  }
  .cta span{padding-left:1px}
  .dot{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.65)}
  .dot.tl{left:250px;top:865px}.dot.tr{left:825px;top:865px}
  .dot.bl{left:250px;top:925px}.dot.br{left:825px;top:925px}

</style>
</head>
<body>
<div class="stage">

  <div class="headline">
    <div>Still taking <em>5+ minutes</em></div>
    <div>to call a new property lead&nbsp;?</div>
  </div>

  <div class="sub">
    DoubleTick Voice AI calls every new lead instantly, qualifies budget<br>
    and intent, and connects your broker only when the buyer is ready.
  </div>

  <div class="wire l"></div>
  <div class="wire r"></div>
  <div class="pip a"></div><div class="pip b"></div>
  <div class="pip c"></div><div class="pip d"></div>

  <!-- NEW LEAD -->
  <div class="node lead">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="4" fill="#14A862"/>
      <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#14A862"/>
    </svg>
  </div>
  <div class="node-label lead">NEW LEAD</div>

  <!-- AI CALL -->
  <div class="call">
    <div class="ring">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1.1l-2.3 2.1z"/>
      </svg>
    </div>
    <div class="timer">00:01</div>
    <div class="status"><i></i>AI Calling Now</div>
  </div>
  <div class="drop"></div>

  <!-- BROKER -->
  <div class="node broker">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="#14A862">
      <path d="M12 2.6c-4.4 0-8 3.6-8 8v5.1c0 1.4 1.1 2.5 2.5 2.5H8c.6 0 1-.4 1-1v-5c0-.6-.4-1-1-1H6v-.6c0-3.3 2.7-6 6-6s6 2.7 6 6v.6h-2c-.6 0-1 .4-1 1v5c0 .6.4 1 1 1h2c0 1-.9 1.6-2.6 1.8-.3-.6-.9-1-1.6-1-1 0-1.8.8-1.8 1.8s.8 1.8 1.8 1.8c.8 0 1.4-.5 1.7-1.2 2.6-.3 4.2-1.5 4.4-3.5.9-.4 1.5-1.3 1.5-2.4v-5.1c0-4.4-3.6-8-8-8z"/>
    </svg>
  </div>
  <div class="node-label broker">BROKER</div>

  <div class="cta-shadow"></div>
  <div class="cta"><span>NEVER LET A HOT LEAD GO COLD</span></div>
  <div class="dot tl"></div><div class="dot tr"></div>
  <div class="dot bl"></div><div class="dot br"></div>

</div>
</body>
</html>
